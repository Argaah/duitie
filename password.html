<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Keamanan & Password - Duitie</title>
    <link rel="stylesheet" href="css/password.css">
 </head>

<body>

    <div class="container">

        <header class="header">
            <h1>🔒 Duitie</h1>
            <p>Keamanan & Password</p>
        </header>

        <main class="card">

            <h2>Buat Password</h2>

            <p class="info">
                Buat password baru untuk akun Duitie kamu.
                Gunakan minimal 12 karakter dan jangan pakai
                password yang sama dengan akun lain.
            </p>

            <form id="form-password">

                <label for="password-baru">
                    Password Baru
                </label>

                <input
                    type="password"
                    id="password-baru"
                    minlength="12"
                    autocomplete="new-password"
                    placeholder="Masukkan password baru"
                    required
                >

                <label for="konfirmasi">
                    Konfirmasi Password Baru
                </label>

                <input
                    type="password"
                    id="konfirmasi"
                    minlength="12"
                    autocomplete="new-password"
                    placeholder="Ulangi password baru"
                    required
                >

                <button type="submit" class="btn-simpan">
                    Simpan Password
                </button>

            </form>

            <p id="pesan" role="status"></p>

            <a href="profile.html" class="kembali">
                ← Kembali ke Profil
            </a>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dialog.js"></script>
    <script src="js/password.js"></script>
</body>
</html>
