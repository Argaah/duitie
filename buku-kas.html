<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Kas - Duitie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body data-page="kas">

    <div class="app-page">
        <header>
            <div class="logo">
                <h1>Duitie</h1>
            </div>
            <h2>Buku Kas</h2>
        </header>

        <main>
            <!-- Filter -->
            <section class="card">
                <h3>Filter</h3>
                <div class="filters">
                    <select class="field" id="fBulan" aria-label="Periode"></select>
                    <select class="field" id="fAkun" aria-label="Rekening"></select>
                    <select class="field" id="fJenis" aria-label="Jenis">
                        <option value="all">Semua jenis</option>
                        <option value="masuk">Pemasukan</option>
                        <option value="keluar">Pengeluaran</option>
                        <option value="transfer">Transfer &amp; penyesuaian</option>
                    </select>
                </div>
                <input class="field" id="fCari" type="search" placeholder="Cari keterangan atau kategori..." aria-label="Cari">
            </section>

            <!-- Recap -->
            <section class="card">
                <h3>Recap Buku Kas <small id="recapLabel">(Hitungan Otomatis)</small></h3>
                <div class="row">
                    <span>Pemasukan:</span>
                    <span class="text-green" id="incomeTotal">+Rp 0</span>
                </div>
                <div class="row">
                    <span>Pengeluaran:</span>
                    <span class="text-red" id="expenseTotal">-Rp 0</span>
                </div>
                <div class="row total-box">
                    <span>SELISIH KAS:</span>
                    <span id="balanceTotal">Rp 0</span>
                </div>
            </section>

            <!-- Jurnal -->
            <section class="card">
                <h3>LEMBAR CATATAN HARIAN <small>(Jurnal)</small></h3>
                <div id="journalList"><div class="skeleton">Memuat...</div></div>
                <button class="btn-add" id="btnAdd"><i class="fa-solid fa-plus"></i> CATAT BARU</button>
            </section>
        </main>

        <nav class="bottom-nav" id="bottomNav"></nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dialog.js"></script>
    <script src="js/bank.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/realtime.js"></script>
    <script src="js/buku-kas.js"></script>
</body>
</html>
